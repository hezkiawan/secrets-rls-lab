;; pgbouncer.ini — connection pooler between the API and Postgres.
;; Docs: https://www.pgbouncer.org/config.html

[databases]
;; No "user=" here on purpose: each client logs in as itself (required for SCRAM passthrough,
;; and it keeps per-user identity, e.g. OpenBao's temporary users in M5).
supportdesk = host=postgres port=5432 dbname=supportdesk

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; ---- Authentication ----
;; PgBouncer checks passwords itself. auth_file holds only the lookup user's password;
;; every other user is looked up live in Postgres via auth_query (see 04-pgbouncer-auth.sql).
;; That's what lets temporary users from OpenBao log in, and expired ones get refused.
auth_type  = scram-sha-256
auth_file  = /etc/pgbouncer/userlist.txt
auth_user  = pgbouncer_auth
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)

;; ---- Pooling ----
;; transaction = a server connection is lent to a client only for one transaction.
;; The strictest common mode: plain SET is NOT safe here, SET LOCAL / set_config(..., true) is.
;; If RLS works through this mode, it works through any mode.
pool_mode = transaction
default_pool_size = 10
max_client_conn = 200

;; Protocol-level prepared statements are tracked across pooled connections (PgBouncer 1.21+).
max_prepared_statements = 200

;; Drivers (incl. Go's pgx) send this startup parameter; PgBouncer can safely ignore it.
ignore_startup_parameters = extra_float_digits

;; Log connections so you can watch users (incl. OpenBao's temporary ones) arrive.
log_connections = 1
log_disconnections = 1
