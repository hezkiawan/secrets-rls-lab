# haproxy.cfg — one stable address (:8300) for the whole OpenBao cluster.
#
# Apps talk ONLY to the load balancer. HAProxy asks every node GET /v1/sys/health:
#   200 = active (leader)  ← traffic goes here
#   429 = standby, 503 = sealed, 501 = not initialized  ← no traffic
# If the active node dies, the cluster elects a new leader, its health turns 200,
# and HAProxy switches over within a few seconds. Apps never change their address.
# On Tencent Cloud this role can be a CLB (Cloud Load Balancer) with the same health check.

global
  log stdout format raw local0

defaults
  mode    http
  log     global
  option  httplog
  timeout connect 5s
  timeout client  60s
  timeout server  60s

# Docker's internal DNS, so HAProxy starts even before the nodes exist.
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

frontend openbao
  bind :8300
  default_backend openbao_active

backend openbao_active
  option httpchk GET /v1/sys/health
  http-check expect status 200
  default-server check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
  server bao-1 bao-1:8200
  server bao-2 bao-2:8200
  server bao-3 bao-3:8200

# Live status page → http://localhost:8404  (watch the active node move during failover)
frontend stats
  bind :8404
  stats enable
  stats uri /
  stats refresh 2s
