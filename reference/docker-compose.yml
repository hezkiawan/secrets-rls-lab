# reference/docker-compose.yml — the production-like reference stack.
#
# In real life each service here is its own VM (or managed service). The config files
# mounted below are the same files you'd put on those VMs. Production guidance: the research
# report in docs/ (chapter 13).
#
# PostgreSQL with RLS  +  PgBouncer (transaction pooling)
# 3-node OpenBao cluster (Raft, transit auto-unseal) + HAProxy load balancer
#
# Start:   docker compose -f reference/docker-compose.yml up -d --build
# Reset:   docker compose -f reference/docker-compose.yml down -v   (deletes ALL data)
# Full walkthrough: reference/README.md

name: secrets-rls-reference

services:
  # ------------------------------------------------------------------
  # PostgreSQL — schema, roles, RLS policies and seed data are created on first start
  # from postgres/initdb/*.sql (in file-name order). To re-run them: down -v, then up.
  # ------------------------------------------------------------------
  postgres:
    image: postgres:18
    container_name: ref-postgres
    ports:
      - "5433:5432"              # 5433 on your machine (the learning lab uses 5432)
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-dev-only   # LAB ONLY
      POSTGRES_DB: supportdesk
    volumes:
      - refpgdata:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./postgres/demo:/demo:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supportdesk"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------------------
  # PgBouncer — the API connects HERE (port 6432), never to Postgres directly.
  # Transaction pooling + auth_query (see pgbouncer/pgbouncer.ini).
  # ------------------------------------------------------------------
  pgbouncer:
    build: ./pgbouncer
    container_name: ref-pgbouncer
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ------------------------------------------------------------------
  # pgAdmin for the reference database → http://localhost:5051
  # (Postgres password: postgres-dev-only)
  # ------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: ref-pgadmin
    ports:
      - "5051:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@secretslab.dev
      PGADMIN_DEFAULT_PASSWORD: pgadmin-dev-only
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ==================================================================
  # M5 — OpenBao cluster
  # ==================================================================

  # The "unsealer": a small separate OpenBao whose transit engine holds the key that
  # unlocks the main cluster (auto-unseal). Persistent, and unseals itself with a static
  # key, so it survives restarts. PRODUCTION: a hardened OpenBao on its own VM (or a KMS/HSM).
  unsealer:
    image: openbao/openbao:2.7.1
    container_name: ref-unsealer
    entrypoint: ["bao", "server", "-config=/openbao/config/unsealer.hcl"]
    ports:
      - "8220:8200"
    environment:
      UNSEALER_STATIC_KEY: "bGFiLW9ubHktc3RhdGljLWtleS0zMi1ieXRlcyEhISE="   # LAB ONLY (32 bytes, base64)
    volumes:
      - ./unsealer/unsealer.hcl:/openbao/config/unsealer.hcl:ro
      - unsealerdata:/openbao/file
    healthcheck:
      # healthy as soon as it answers, even before its first init
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8200/v1/sys/health?uninitcode=200' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  unsealer-setup:
    image: openbao/openbao:2.7.1
    user: "0:0"
    entrypoint: ["/bin/sh", "/unsealer/setup.sh"]
    environment:
      BAO_ADDR: http://unsealer:8200
      UNSEAL_TOKEN: lab-transit-unseal-token        # LAB ONLY fixed token ID
    volumes:
      - ./unsealer:/unsealer:ro
      - ./.secrets:/secrets                         # unsealer-init.json (LAB ONLY)
    depends_on:
      unsealer:
        condition: service_healthy

  # Three OpenBao nodes = three VMs in production. Same image, different config file.
  bao-1: &bao-node
    image: openbao/openbao:2.7.1
    container_name: ref-bao-1
    entrypoint: ["bao", "server", "-config=/openbao/config/bao.hcl"]
    environment:
      BAO_TOKEN: lab-transit-unseal-token          # used by the transit seal (docs: use env, not the file)
    ports:
      - "8201:8200"                        # direct access to this node (debugging)
    volumes:
      - ./openbao/bao-1.hcl:/openbao/config/bao.hcl:ro
      - bao1data:/openbao/file
    depends_on:
      unsealer-setup:
        condition: service_completed_successfully

  bao-2:
    <<: *bao-node
    container_name: ref-bao-2
    ports:
      - "8202:8200"
    volumes:
      - ./openbao/bao-2.hcl:/openbao/config/bao.hcl:ro
      - bao2data:/openbao/file

  bao-3:
    <<: *bao-node
    container_name: ref-bao-3
    ports:
      - "8203:8200"
    volumes:
      - ./openbao/bao-3.hcl:/openbao/config/bao.hcl:ro
      - bao3data:/openbao/file

  # The ONE address apps use: http://localhost:8300 → always the active node.
  haproxy:
    image: haproxy:3.4.6-alpine
    container_name: ref-haproxy
    ports:
      - "8300:8300"   # OpenBao (API + UI) via the load balancer
      - "8404:8404"   # HAProxy status page
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - bao-1
      - bao-2
      - bao-3

  # Admin toolbox: runs the scripts in ./scripts (init, configure, import-env, snapshot).
  #   docker compose -f reference/docker-compose.yml run --rm tools /scripts/init.sh
  tools:
    image: openbao/openbao:2.7.1
    profiles: ["tools"]
    user: "0:0"
    entrypoint: ["/bin/sh"]
    environment:
      BAO_ADDR: http://haproxy:8300
    volumes:
      - ./scripts:/scripts:ro
      - ./openbao/policies:/policies:ro
      - ./scripts:/env:ro               # example.env for the import demo
      - ./.secrets:/secrets             # init.json (LAB ONLY, git-ignored)
      - ./backups:/backups              # Raft snapshots (git-ignored)
      - ../api/.reference:/out          # the API's role_id + secret_id (git-ignored)

volumes:
  refpgdata:
  bao1data:
  bao2data:
  bao3data:
  unsealerdata:
